<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Printable Assessment — Cymor Tutor</title>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="app-shell">
  <div id="cymor-nav-root"></div>
  <div class="page-content">

    <h2>📄 Printable Assessment</h2>
    <p class="muted">Generate a full revision exam paper as a PDF — a proper "Cymor Tutor Assessment" with a marking scheme, ready to print and work through offline.</p>

    <div id="exam-error"></div>

    <div class="field">
      <label>Subject</label>
      <input type="text" id="subject-input" placeholder="e.g. Integrated Science" />
    </div>
    <div class="field">
      <label>Topic</label>
      <input type="text" id="topic-input" placeholder="e.g. Cells" />
    </div>
    <div class="field">
      <label>Multiple-choice questions</label>
      <select id="num-mcq-input">
        <option value="5">5</option>
        <option value="8" selected>8</option>
        <option value="10">10</option>
        <option value="15">15</option>
      </select>
    </div>
    <div class="field">
      <label>Short-answer questions</label>
      <select id="num-short-input">
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="6">6</option>
        <option value="8">8</option>
      </select>
    </div>
    <div class="field" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="include-essay-input" style="width:auto;" />
      <label style="margin:0;" for="include-essay-input">Include a 20-mark essay question</label>
    </div>

    <button class="btn btn-primary btn-block" id="generate-exam-btn">Generate PDF assessment</button>
    <p class="muted" style="font-size:12.5px; text-align:center; margin-top:10px;">Includes a full marking scheme at the end for self-marking or revision.</p>

  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/state/store.js"></script>
<script src="../js/services/auth.js"></script>
<script src="../js/components/nav.js"></script>
<script src="exam.js"></script>
</body>
</html>
