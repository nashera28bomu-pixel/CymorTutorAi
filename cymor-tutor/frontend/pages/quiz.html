<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz — Cymor Tutor</title>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="app-shell">
  <div id="cymor-nav-root"></div>
  <div class="page-content">

    <div id="setup-view">
      <h2>Quiz Me</h2>
      <p class="muted">Choose a topic and Cymor will build you a quiz.</p>

      <div id="setup-error"></div>

      <div class="field">
        <label>Subject</label>
        <input type="text" id="subject-input" placeholder="e.g. Integrated Science" />
      </div>
      <div class="field">
        <label>Topic</label>
        <input type="text" id="topic-input" placeholder="e.g. Cells" />
      </div>
      <div class="field">
        <label>Difficulty</label>
        <select id="difficulty-input">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="field">
        <label>Number of questions</label>
        <select id="num-input">
          <option value="5" selected>5</option>
          <option value="8">8</option>
          <option value="10">10</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="generate-btn">Generate quiz</button>
    </div>

    <div id="quiz-view" style="display:none;">
      <div class="quiz-progress"><div class="quiz-progress-fill" id="progress-fill"></div></div>
      <div class="quiz-question-label" id="question-label"></div>
      <h3 id="question-text"></h3>
      <div id="options-container"></div>
      <div id="quiz-explain" class="quiz-explain" style="display:none;"></div>
      <button class="btn btn-primary btn-block" id="next-btn" disabled>Submit answer</button>
    </div>

    <div id="result-view" style="display:none; text-align:center;">
      <h2>Quiz complete 🎉</h2>
      <div class="quiz-score" id="score-display"></div>
      <p class="muted">Nice work — review your answers below.</p>
      <div id="review-list" style="text-align:left; margin-top:20px;"></div>
      <button class="btn btn-ghost btn-block" id="retry-btn" style="margin-top:16px;">New quiz</button>
    </div>

  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/state/store.js"></script>
<script src="../js/services/auth.js"></script>
<script src="../js/components/nav.js"></script>
<script src="quiz.js"></script>
</body>
</html>
