<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account — Cymor Tutor</title>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="brand" style="margin-bottom:28px;">
    <span class="brand-mark">CT</span>
    <span class="brand-name" style="color:var(--forest);">Cymor Tutor</span>
  </div>

  <h2>Create your account</h2>
  <p class="muted" style="margin-bottom:22px;">Start learning with your AI study partner.</p>

  <div id="error-box"></div>

  <form id="register-form">
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" type="text" required autocomplete="name" />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="new-password" />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
  </form>

  <p class="muted" style="text-align:center; margin-top:18px;">
    Already have an account? <a href="login.html" style="color:var(--forest); font-weight:600;">Sign in</a>
  </p>
</div>

<script src="../js/config.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/state/store.js"></script>
<script src="../js/services/auth.js"></script>
<script src="register.js"></script>
</body>
</html>
