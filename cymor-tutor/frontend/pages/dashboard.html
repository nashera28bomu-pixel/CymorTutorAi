<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Cymor Tutor</title>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="app-shell">
  <div id="cymor-nav-root"></div>

  <div class="page-content">
    <h2 id="greeting">Hello 👋</h2>
    <p class="muted">What would you like to learn today?</p>

    <form id="ask-form" style="display:flex; gap:8px; margin-top:14px;">
      <input type="text" id="ask-input" placeholder="Ask Cymor anything…" style="flex:1; padding:14px 16px; border-radius:24px; border:1.5px solid rgba(22,48,42,0.15); font-size:15px;" />
      <button type="submit" class="btn btn-gold">Ask</button>
    </form>

    <div class="section-title">Quick study</div>
    <div class="study-actions">
      <a href="chat.html" class="study-action-btn">🧠 Learn</a>
      <a href="notes.html" class="study-action-btn">📄 My Notes</a>
      <a href="quiz.html" class="study-action-btn">📝 Quiz</a>
      <a href="flashcards.html" class="study-action-btn">🗂️ Flashcards</a>
    </div>

    <div class="section-title">Your progress</div>
    <div class="stat-grid" id="stat-grid">
      <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Quizzes taken</div></div>
      <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Avg. score</div></div>
    </div>

    <p class="dev-credit">Built by Legendary Smiley Cymor</p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/state/store.js"></script>
<script src="../js/services/auth.js"></script>
<script src="../js/components/nav.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
