<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Cymor Tutor</title>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="brand" style="margin-bottom:28px;">
    <span class="brand-mark">CT</span>
    <span class="brand-name" style="color:var(--forest);">Cymor Tutor</span>
  </div>

  <h2>Welcome back</h2>
  <p class="muted" style="margin-bottom:22px;">Sign in to continue studying.</p>

  <div id="error-box"></div>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
  </form>

  <p class="muted" style="text-align:center; margin-top:18px;">
    New to Cymor Tutor? <a href="register.html" style="color:var(--forest); font-weight:600;">Create an account</a>
  </p>
</div>

<script src="../js/config.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/state/store.js"></script>
<script src="../js/services/auth.js"></script>
<script src="login.js"></script>
</body>
</html>
