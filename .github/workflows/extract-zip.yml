name: Extract Uploaded Zip

on:
  push:
    branches: [ main ]
    paths:
      - '**.zip'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract zip files
        run: |
          mapfile -t zips < <(find . -maxdepth 4 -iname "*.zip" -not -path "./.git/*")

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found. Nothing to do."
            exit 0
          fi

          for zip in "${zips[@]}"; do
            echo "Extracting: $zip"
            dir=$(dirname "$zip")
            unzip -o "$zip" -d "$dir"
            rm -f "$zip"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-extract uploaded zip [skip ci]"
            git push
          fi
